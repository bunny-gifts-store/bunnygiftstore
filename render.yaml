# Render Blueprint — Bunny Gift Store API (Node/Express + SQLite)
# One-click: https://render.com/deploy?repo=https://github.com/bunny-gifts-store/bunnygiftstore
# Or: Render Dashboard -> New + -> Blueprint -> connect this repo.

services:
  - type: web
    name: bunnygiftstore-api
    runtime: node
    plan: free                     # free tier — no card needed
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true        # Render generates a strong secret
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false                # you enter this in the Render UI on deploy
      - key: CORS_ORIGINS
        value: https://bunnygiftsstore.com,https://www.bunnygiftsstore.com
      # DATA PERSISTENCE via Turso (free, survives restarts) — see note below.
      # The DB runs as a libSQL embedded replica synced to a remote Turso primary,
      # so users / orders / products are NOT wiped when the free instance sleeps.
      - key: TURSO_DATABASE_URL
        sync: false                # paste your Turso DB URL (libsql://...) in the Render UI
      - key: TURSO_AUTH_TOKEN
        sync: false                # paste your Turso auth token in the Render UI
      # DURABLE PRODUCT IMAGES via Cloudinary (free) — without this, admin-uploaded
      # / camera-captured images live on the ephemeral disk and vanish on restart.
      # One value: cloudinary://<api_key>:<api_secret>@<cloud_name>  (Cloudinary
      # dashboard -> Product Environment Credentials / API Environment variable).
      - key: CLOUDINARY_URL
        sync: false                # paste your Cloudinary URL in the Render UI

# ---------------------------------------------------------------------------
# DATA PERSISTENCE (do this before taking real orders):
# The free tier has an EPHEMERAL filesystem — a plain local SQLite DB resets
# whenever the service restarts or sleeps, wiping users/orders overnight.
#
# FIX (free): use Turso (https://turso.tech) — a hosted, SQLite-compatible DB.
# The server uses it automatically once TURSO_DATABASE_URL + TURSO_AUTH_TOKEN
# are set (above). One-time setup with the Turso CLI:
#
#   turso auth signup
#   turso db create bunnygiftstore
#   turso db show bunnygiftstore --url          # -> TURSO_DATABASE_URL
#   turso db tokens create bunnygiftstore       # -> TURSO_AUTH_TOKEN
#
# Paste both values into the Render service's Environment settings, then deploy.
# The first boot creates the schema + seeds products in Turso; every later boot
# re-syncs from Turso, so data persists forever.
#
# NOTE: uploaded item images (server/uploads) still live on the ephemeral disk.
# Admin-uploaded product images will reset on restart unless you also move them
# to durable storage (e.g. a paid Render disk, or an object store like S3/R2).
# ---------------------------------------------------------------------------
