# Render Blueprint — Bunny Gift Store API (Node/Express + SQLite)
# One-click: https://render.com/deploy?repo=https://github.com/bunny-gifts-store/bunnygiftstore
# Or: Render Dashboard -> New + -> Blueprint -> connect this repo.

services:
  - type: web
    name: bunnygiftstore-api
    runtime: node
    plan: free                     # free tier — no card needed
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true        # Render generates a strong secret
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false                # you enter this in the Render UI on deploy
      - key: CORS_ORIGINS
        value: https://bunnygiftsstore.com,https://www.bunnygiftsstore.com

# ---------------------------------------------------------------------------
# DATA PERSISTENCE (do this before taking real orders):
# The free tier has an EPHEMERAL filesystem — the SQLite DB + uploaded images
# reset whenever the service restarts or sleeps. To keep users/orders forever,
# upgrade the instance to a paid plan and add a disk:
#
#   plan: starter                  # ~$7/mo, and enables a disk
#   ...
#   envVars:
#     - key: DB_PATH
#       value: /data/bunnystore.db
#     - key: UPLOADS_DIR
#       value: /data/uploads
#   disk:
#     name: bunny-data
#     mountPath: /data
#     sizeGB: 1
# ---------------------------------------------------------------------------
