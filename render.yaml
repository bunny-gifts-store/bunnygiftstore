# Render Blueprint — Bunny Gift Store API (Node/Express + PostgreSQL)
# One-click: https://render.com/deploy?repo=https://github.com/bunny-gifts-store/bunnygiftstore
# Or: Render Dashboard -> New + -> Blueprint -> connect this repo.

services:
  - type: web
    name: bunnygiftstore-api
    runtime: node
    plan: free                     # free tier — no card needed
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true        # Render generates a strong secret
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false                # you enter this in the Render UI on deploy
      - key: CORS_ORIGINS
        value: https://bunnygiftsstore.com,https://www.bunnygiftsstore.com
      # DATA PERSISTENCE via PostgreSQL (survives restarts) — see note below.
      # The database is a separate managed service, so users / orders / products
      # are NOT wiped when this free instance sleeps or redeploys.
      - key: DATABASE_URL
        sync: false                # paste your Postgres connection string in the Render UI
      # DURABLE PRODUCT IMAGES via Cloudinary (free) — without this, admin-uploaded
      # / camera-captured images live on the ephemeral disk and vanish on restart.
      # One value: cloudinary://<api_key>:<api_secret>@<cloud_name>  (Cloudinary
      # dashboard -> Product Environment Credentials / API Environment variable).
      - key: CLOUDINARY_URL
        sync: false                # paste your Cloudinary URL in the Render UI

# ---------------------------------------------------------------------------
# DATA PERSISTENCE (do this before taking real orders):
# The free tier has an EPHEMERAL filesystem — anything written inside the
# container is wiped whenever the service restarts or sleeps. The database
# therefore has to live OUTSIDE it, or users/orders disappear overnight.
#
# FIX: a managed PostgreSQL database. The server uses it automatically once
# DATABASE_URL is set (above), and REFUSES to start in production without it —
# so a misconfigured deploy fails loudly instead of silently losing orders.
#
# Free options:
#   Neon      https://neon.tech      -> Dashboard -> Connection string
#   Supabase  https://supabase.com   -> Project Settings -> Database -> URI
#   Render    Dashboard -> New + -> Postgres -> Internal Database URL
#
# The value looks like:
#   postgresql://user:password@host/database
#
# Paste it into the Render service's Environment settings, then deploy. The
# first boot creates the schema and seeds the catalogue; every later boot finds
# the data already there, so it persists across restarts and redeploys.
#
# NOTE: uploaded item images (server/uploads) still live on the ephemeral disk.
# Admin-uploaded product images will reset on restart unless you also move them
# to durable storage — set CLOUDINARY_URL above, or use an object store.
# ---------------------------------------------------------------------------
