<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bunny Gift Store - Premium Gifts & Presents</title>
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Premium gifts, custom photo frames and personalised presents from Bunny Gift Store." />

    <!-- Favicon (browser tab icon) -->
    <link rel="icon" type="image/png" href="/images/favicon.png" />

    <!-- ===== Progressive Web App ===== -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a1a2e" />
    <!-- iOS: no manifest support, so installability is configured with these -->
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bunny Gift Store" />
    <!-- Windows tiles -->
    <meta name="msapplication-TileColor" content="#1a1a2e" />
    <meta name="msapplication-TileImage" content="/images/pwa-icon-192.png" />

    <!-- Bootstrap CSS (same version as the original storefront) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
          crossorigin="anonymous" />

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- The original theme, reused verbatim -->
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
