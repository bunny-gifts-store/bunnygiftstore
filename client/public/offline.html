<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — Bunny Gift Store</title>
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <!--
      Deliberately self-contained: this page is the last resort when the network
      is unavailable, so it must not depend on the CDN stylesheet, Google Fonts
      or any hashed bundle. Colours mirror the storefront theme tokens.
    -->
    <style>
        :root {
            --primary-color: #1a1a2e;
            --secondary-color: #7b4397;
            --accent-color: #dc81a2;
            --light-purple: #c77dff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: #fff;
            line-height: 1.6;
            text-align: center;
        }
        .offline-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 1.75rem 2rem;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 22px;
            backdrop-filter: blur(8px);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        }
        .offline-logo { width: 76px; height: 76px; margin-bottom: 1.1rem; border-radius: 18px; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.6rem; }
        p { font-size: 0.95rem; color: rgba(255, 255, 255, 0.82); margin-bottom: 1.6rem; }
        .retry {
            display: inline-block;
            padding: 0.75rem 2.2rem;
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--light-purple), var(--accent-color));
            border: 0;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .retry:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0, 0, 0, 0.3); }
        .hint { margin: 1.4rem 0 0; font-size: 0.8rem; color: rgba(255, 255, 255, 0.6); }
        @media (prefers-reduced-motion: reduce) { .retry { transition: none; } }
    </style>
</head>
<body>
    <main class="offline-card">
        <img class="offline-logo" src="/images/pwa-icon-192.png" alt="Bunny Gift Store" />
        <h1>You're offline</h1>
        <p>
            We couldn't reach Bunny Gift Store. Check your internet connection and
            try again &mdash; pages you've already visited stay available offline.
        </p>
        <button class="retry" type="button" onclick="location.reload()">Try again</button>
        <p class="hint">This page will reload automatically once you're back online.</p>
    </main>
    <script>
        // Auto-recover the moment connectivity returns.
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
