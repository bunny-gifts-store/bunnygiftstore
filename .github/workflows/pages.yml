name: Deploy React app to GitHub Pages

# Deploys the React client to GitHub Pages.
# The backend is live on Render and client/src/config.js defaults the API base
# to it, so no repo Variable is strictly required. To override the API URL,
# set the repo Variable VITE_API_BASE.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build the React client
        working-directory: client
        env:
          # Set this repo Variable to your Render API URL, e.g.
          # https://bunnygiftstore-api.onrender.com
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          npm ci
          npm run build

      - name: SPA fallback + Pages metadata
        working-directory: client/dist
        run: |
          cp index.html 404.html   # let React Router handle deep links
          touch .nojekyll           # don't run Jekyll on the build output
          # CNAME is copied from client/public/CNAME automatically

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
