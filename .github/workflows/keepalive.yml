name: Keep the API awake

# WHY THIS EXISTS
# ---------------
# The API runs on Render's free tier, which SPINS THE INSTANCE DOWN after ~15
# minutes with no inbound traffic. The next request then has to boot a container
# from cold, which takes 50 seconds or more — and that request is usually a
# customer or the owner pressing "Login", so the button sits on "Signing in…"
# for the better part of a minute and looks broken.
#
# No amount of client-side code fixes that: the server genuinely is not running.
# The only real fixes are (a) never let it go idle, or (b) pay for a plan with no
# spin-down. This workflow is (a): a request every 10 minutes keeps the 15-minute
# idle timer from ever expiring, so logins hit an already-running server.
#
# /api/ping is deliberately the cheapest endpoint in the API — no database, no
# auth, no rate limit — so this costs the service essentially nothing.
#
# KNOWN LIMITS (read before relying on this):
#   * GitHub's scheduled runs are best-effort and can be delayed by several
#     minutes under load. The 10-minute cadence leaves slack for that; do not
#     stretch it past ~13 minutes.
#   * GitHub disables scheduled workflows in repositories with no activity for
#     60 days. If logins get slow again months from now, check that this
#     workflow is still enabled (Actions tab) before looking anywhere else.
#   * Render's free tier includes 750 instance-hours/month and a calendar month
#     is ~730 hours, so keeping ONE service awake continuously fits — but only
#     one. A second always-on free service would exhaust the allowance.
#   * If you later move the API off Render's free tier, delete this workflow.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Never let two pings overlap, and never let a queued backlog build up.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        env:
          # Override with the repo Variable API_URL if the API ever moves hosts.
          API_URL: ${{ vars.API_URL || 'https://bunnygiftstore-api.onrender.com' }}
        run: |
          # --max-time 120 covers a cold start: if the instance HAS gone to
          # sleep, this request is the one that wakes it, and waking is exactly
          # the job. Retry so a single blip doesn't leave it asleep for another
          # 10 minutes.
          curl --fail --silent --show-error \
               --retry 3 --retry-delay 15 --retry-all-errors \
               --max-time 120 \
               -o /dev/null -w 'ping ok in %{time_total}s\n' \
               "$API_URL/api/ping"
